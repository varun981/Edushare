services:
  - type: web
    name: edushare
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn "app:create_app()"
    envVars:
      - key: FLASK_CONFIG
        value: production
      - key: SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SESSION_COOKIE_SECURE
        value: "1"
      - key: RATELIMIT_STORAGE_URI
        sync: false
      - key: TRUST_PROXY
        value: "1"
      - key: AUTO_CREATE_TABLES
        value: "1"
      - key: MAIL_SERVER
        sync: false
      - key: MAIL_PORT
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_DEFAULT_SENDER
        sync: false
